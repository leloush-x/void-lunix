# voidc unattended profile — Hyprland (source build only!)
#
# IMPORTANT: as of 2026 Hyprland is NOT packaged in the Void repos
# (verified against void-packages / xq-api.voidlinux.org). This profile
# therefore skips the Hyprland packages and only generates the configs.
# Use it if you built Hyprland (and friends: hyprpaper, hypridle, hyprlock,
# aquamarine, hyprlang, hyprcursor) from source yourself.
#
# For a working Wayland setup out of the box, use profiles/niri.conf or
# profiles/sway.

# ---- disk ------------------------------------------------------------------
DISK=/dev/vda            # REQUIRED: /dev/sda, /dev/nvme0n1, /dev/vda ...

FILESYSTEM=ext4
SWAP_MB=auto             # auto | none | 2048 | 4096 | 8192
LUKS=no
# LUKS_PASSWORD=changeme

# ---- system ----------------------------------------------------------------
HOSTNAME=void
TIMEZONE=UTC
KEYMAP=us
LOCALE=en_US.UTF-8

USERNAME=void
ROOT_PASS=changeme       # REQUIRED in unattended mode
USER_PASS=changeme

# ---- packages --------------------------------------------------------------
SESSION=wayland
DESKTOP=hyprland
# Add extra packages you need, e.g. a Wayland bar/launcher if you don't
# install them separately:
CUSTOM_PKGS=""

EXTRAS="audio networking fonts nonfree multilib"

# ---- advanced --------------------------------------------------------------
GPU_DRIVER=auto          # intel | amd | nvidia (nvidia enables nonfree repo)
LOGIN_MANAGER=greetd

MIRROR=auto

# ---- desktop tweaks --------------------------------------------------------
AUTOSTART_DESKTOP=no
DOTFILES_URL=
RUN_DOTFILES_INSTALL=no
