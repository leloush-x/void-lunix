# voidc unattended profile — Hyprland (Wayland) preset
#   voidc --auto profiles/hyprland.conf
#
# Hyprland is not packaged in Void: voidc automatically enables the
# hyprland-void community repository (github.com/Makrennel/hyprland-void)
# on the live system and in the target, picking the right branch for your
# libc (x86_64 x glibc/musl). Third-party software — use it
# only if you trust that repository.

# ---- disk ------------------------------------------------------------------
DISK=/dev/vda            # REQUIRED: /dev/sda, /dev/nvme0n1, /dev/vda ...

FILESYSTEM=ext4          # ext4 | btrfs | xfs | f2fs
SWAP_MB=auto             # auto | none | 2048 | 4096 | 8192
LUKS=no                  # yes | no
# LUKS_PASSWORD=changeme # REQUIRED when LUKS=yes

# ---- system ----------------------------------------------------------------
HOSTNAME=void
TIMEZONE=UTC
KEYMAP=us
LOCALE=en_US.UTF-8

USERNAME=void
ROOT_PASS=changeme       # REQUIRED in unattended mode
USER_PASS=changeme       # defaults to ROOT_PASS

# ---- packages --------------------------------------------------------------
SESSION=wayland
DESKTOP=hyprland         # hyprland + hyprpaper/hypridle/hyprlock + portal
EXTRAS="audio networking fonts nonfree multilib"

# ---- advanced --------------------------------------------------------------
GPU_DRIVER=auto          # intel | amd | nvidia (nvidia enables nonfree repo)
LOGIN_MANAGER=greetd     # greetd + tuigreet works great for Wayland sessions

MIRROR=auto

# ---- desktop tweaks --------------------------------------------------------
AUTOSTART_DESKTOP=no
DOTFILES_URL=
RUN_DOTFILES_INSTALL=no
