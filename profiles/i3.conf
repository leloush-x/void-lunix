# voidc unattended profile — copy, edit, then:
#   voidc --auto profiles/i3.conf
# Every key is optional unless marked REQUIRED.

# ---- disk ------------------------------------------------------------------
# REQUIRED: target disk, e.g. /dev/sda, /dev/nvme0n1, /dev/vda
DISK=/dev/vda

FILESYSTEM=ext4          # ext4 | btrfs
SWAP_MB=auto             # auto | none | 2048 | 4096 | 8192
LUKS=no                  # yes | no
# LUKS_PASSWORD=changeme  # REQUIRED when LUKS=yes

# ---- system ----------------------------------------------------------------
HOSTNAME=void
TIMEZONE=UTC             # e.g. Europe/Berlin
KEYMAP=us
LOCALE=en_US.UTF-8

USERNAME=void
ROOT_PASS=changeme       # REQUIRED in unattended mode
USER_PASS=changeme       # defaults to ROOT_PASS

# ---- packages --------------------------------------------------------------
DESKTOP=i3               # none|i3|bspwm|dwm|openbox|sway|xfce|kde|gnome|cinnamon|mate|custom
# CUSTOM_PKGS="xorg xinit i3 alacritty rofi"

# extra features: audio networking fonts nonfree multilib bluetooth printing ssh
EXTRAS="audio networking fonts nonfree multilib"

MIRROR=auto              # auto | default | https://your.mirror.example

# ---- desktop tweaks --------------------------------------------------------
AUTOSTART_X=no           # start desktop automatically on tty1 (startx desktops)
DOTFILES_URL=            # e.g. https://github.com/you/dotfiles
RUN_DOTFILES_INSTALL=no  # run ./install.sh from the dotfiles repo
