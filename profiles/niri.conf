# voidc unattended profile — niri (Wayland) preset
#   voidc --auto profiles/niri.conf

# ---- disk ------------------------------------------------------------------
DISK=/dev/vda            # REQUIRED: /dev/sda, /dev/nvme0n1, /dev/vda ...

FILESYSTEM=ext4          # ext4 | btrfs | xfs | f2fs
SWAP_MB=auto             # auto | 0 (off) | 64-65536 MiB
LUKS=no                  # yes | no
# LUKS_PASSWORD=changeme # REQUIRED when LUKS=yes

# ---- system ----------------------------------------------------------------
HOSTNAME=void
TIMEZONE=UTC
KEYMAP=us
LOCALE=en_US.UTF-8

USERNAME=void
ROOT_PASS=changeme       # REQUIRED in unattended mode
USER_PASS=changeme       # defaults to ROOT_PASS

# ---- packages --------------------------------------------------------------
SESSION=wayland
DESKTOP=niri             # niri preset: niri + Waybar/wofi/mako/foot + wallpaper
EXTRAS="audio networking fonts nonfree multilib"

# ---- advanced --------------------------------------------------------------
GPU_DRIVER=auto          # intel | amd | nvidia (nvidia enables nonfree repo)
LOGIN_MANAGER=greetd     # greetd + tuigreet works great for Wayland sessions

MIRROR=auto

# ---- desktop tweaks --------------------------------------------------------
AUTOSTART_DESKTOP=no
DOTFILES_URL=
RUN_DOTFILES_INSTALL=no
