name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dry-run:
    name: sandbox dry run (x86_64 · glibc)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: ShellCheck version (preinstalled on the runner)
        run: shellcheck --version
      - name: Run sandboxed installer test suite
        run: sudo bash tests/run.sh

  musl:
    name: sandbox dry run (x86_64 · musl)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: voidlinux/voidlinux-musl:latest
    steps:
      - name: Point xbps at the current mirror
        run: |
          mkdir -p /etc/xbps.d
          printf 'repository=https://repo-default.voidlinux.org/current/musl\n' \
            > /etc/xbps.d/00-repository-main.conf
      - name: Update xbps (the image ships an old version)
        run: xbps-install -Syu xbps
      - name: Install test tools
        run: xbps-install -Sy bash curl git coreutils findutils gzip tar sed grep tzdata shellcheck
      - name: Clone (actions/checkout's node runtime does not run on musl)
        run: git clone --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" .
      - name: ShellCheck version
        run: shellcheck --version
      - name: Run sandboxed installer test suite
        run: bash tests/run.sh
